name: smartfarm-mvp
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: smartfarm
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: ${SMARTFARM_DB_PASSWORD:?Initialize .local/postgres/db.env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfarm -d smartfarm"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
