server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
    parser:
      strict-duplicate-detection: true
  datasource:
    url: ${SMARTFARM_DB_URL:jdbc:postgresql://127.0.0.1:5433/smartfarm}
    username: ${SMARTFARM_DB_USER:smartfarm}
    password: ${SMARTFARM_DB_PASSWORD}
  flyway:
    enabled: true
smartfarm:
  mqtt:
    enabled: ${SMARTFARM_MQTT_ENABLED:false}
  control:
    enabled: ${SMARTFARM_CONTROL_ENABLED:false}
    circuit-route-required: ${SMARTFARM_PUMP_CIRCUIT_ROUTE_REQUIRED:false}
    pump-fencing-enabled: ${SMARTFARM_PUMP_FENCING_ENABLED:false}
  irrigation:
    queue-schedule-enabled: ${SMARTFARM_IRRIGATION_QUEUE_SCHEDULE_ENABLED:false}
    session-closure-enabled: ${SMARTFARM_IRRIGATION_SESSION_CLOSURE_ENABLED:false}
    queue-handoff-enabled: ${SMARTFARM_IRRIGATION_QUEUE_HANDOFF_ENABLED:false}
    flow-stop-enabled: ${SMARTFARM_IRRIGATION_FLOW_STOP_ENABLED:false}
    water-stop-enabled: ${SMARTFARM_IRRIGATION_WATER_STOP_ENABLED:false}
    rain-stop-enabled: ${SMARTFARM_IRRIGATION_RAIN_STOP_ENABLED:false}
    session-enabled: ${SMARTFARM_IRRIGATION_SESSION_ENABLED:false}
    circuit-demo-enabled: ${SMARTFARM_IRRIGATION_CIRCUIT_DEMO_ENABLED:false}
    monitor-enabled: ${SMARTFARM_IRRIGATION_MONITOR_ENABLED:false}
    demo-enabled: ${SMARTFARM_IRRIGATION_DEMO_ENABLED:false}
    position-feedback-required: ${SMARTFARM_IRRIGATION_POSITION_FEEDBACK_REQUIRED:false}
