# Tests drive the preview clock explicitly; cached Spring contexts must not run background ticks.
smartfarm.irrigation-queue.scheduling-enabled=false
# Multiple cached Spring contexts share one isolated PostgreSQL (100 connections).
# Leave room for Flyway and the two-instance dispatch tests without growing each pool to 10.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
