name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: smartfarm_test
          POSTGRES_USER: smartfarm
          POSTGRES_PASSWORD: smartfarm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartfarm -d smartfarm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SMARTFARM_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/smartfarm_test?currentSchema=telemetry_test
      SMARTFARM_DB_USER: smartfarm
      SMARTFARM_DB_PASSWORD: smartfarm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvnw verify
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee "$RUNNER_TEMP/mvn.log"
      - name: Report surefire summary
        if: always()
        run: python3 .github/scripts/report.py surefire backend/target/surefire-reports "$RUNNER_TEMP/mvn.log"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: lint
        run: npm run lint 2>&1 | tee -a "$RUNNER_TEMP/fe.log"; exit ${PIPESTATUS[0]}
        shell: bash
      - name: build
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/fe.log"; exit ${PIPESTATUS[0]}
        shell: bash
      - name: unit (node:test)
        run: node --import tsx --test $(find src -name '*.test.ts') 2>&1 | tee -a "$RUNNER_TEMP/fe.log"; exit ${PIPESTATUS[0]}
        shell: bash
      - name: install chromium
        shell: bash
        run: npx playwright install --with-deps chromium 2>&1 | tee -a "$RUNNER_TEMP/fe.log" | tail -5; exit ${PIPESTATUS[0]}
      - name: playwright
        shell: bash
        run: |
          status=0
          for t in automation events monitoring dashboard safety alerts nodes actuators; do
            if npm run -s "test:$t" > "$RUNNER_TEMP/pw-$t.log" 2>&1; then r=PASS; else r=FAIL; status=1; fi
            echo "test:$t $r $(grep -E '^ +[0-9]+ (passed|failed|flaky|skipped)' "$RUNNER_TEMP/pw-$t.log" | tr -s ' ' | tr '\n' ' ')" | tee -a "$RUNNER_TEMP/pw-summary.log"
            [ "$r" = FAIL ] && cat "$RUNNER_TEMP/pw-$t.log" >> "$RUNNER_TEMP/fe.log"
          done
          exit $status
      - name: Report
        if: always()
        run: python3 .github/scripts/report.py log frontend "$RUNNER_TEMP/pw-summary.log" "$RUNNER_TEMP/fe.log"

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}
      - run: pip install -r tools/requirements-day1.txt pytest cryptography
      - name: native + python tests
        shell: bash
        run: |
          set -o pipefail
          {
            git -c advice.detachedHead=false clone -q --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson "$RUNNER_TEMP/ArduinoJson"
            # mbedtls 2.28 = the version in ESP-IDF 4.4 / Arduino-ESP32 2.x (OTA hash + signature tests)
            git -c advice.detachedHead=false clone -q --depth 1 --branch v2.28.8 https://github.com/Mbed-TLS/mbedtls "$RUNNER_TEMP/mbedtls"
            cmake -S "$RUNNER_TEMP/mbedtls" -B "$RUNNER_TEMP/mbedtls/build" -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF > /dev/null
            make -s -C "$RUNNER_TEMP/mbedtls/build" -j4 mbedcrypto > /dev/null
            for f in tools/tests/*_test.cpp; do
              n=$(basename "$f" .cpp)
              g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I"$RUNNER_TEMP/ArduinoJson/src" -I"$RUNNER_TEMP/mbedtls/include" \
                -o "$RUNNER_TEMP/$n" "$f" -L"$RUNNER_TEMP/mbedtls/build/library" -lmbedcrypto
              "$RUNNER_TEMP/$n" > /dev/null
              echo "native $n PASS"
            done
            python -m pytest -q tools/tests
          } 2>&1 | tee -a "$RUNNER_TEMP/fw.log"
      - name: PlatformIO builds
        shell: bash
        run: |
          set -o pipefail
          for d in $(dirname $(ls firmware/*/platformio.ini)); do
            echo "== $d" | tee -a "$RUNNER_TEMP/fw.log"
            (cd "$d" && pio run -j 2 2>&1 | tee -a "$RUNNER_TEMP/fw.log" | grep -E 'RAM:|Flash:|SUCCESS|FAILED|error' ) || exit 1
          done
      - name: Report
        if: always()
        run: python3 .github/scripts/report.py log firmware "$RUNNER_TEMP/fw.log" "$RUNNER_TEMP/fw.log"

  wokwi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: build self-test image
        shell: bash
        run: |
          set -o pipefail
          cd firmware/esp32 && pio run -e wokwi_selftest 2>&1 | tee "$RUNNER_TEMP/wokwi-cli.log" | tail -5
      - name: run Wokwi scenario
        if: ${{ env.WOKWI_CLI_TOKEN != '' }}
        shell: bash
        run: |
          curl -sL https://wokwi.com/ci/install.sh | sh
          set -o pipefail
          ~/.wokwi/bin/wokwi-cli --timeout 60000 --scenario scenario.yaml \
            --serial-log-file "$RUNNER_TEMP/wokwi.log" firmware/esp32/test/wokwi 2>&1 | tee "$RUNNER_TEMP/wokwi-cli.log"
      - name: Report
        if: always()
        shell: bash
        run: |
          if [ -z "$WOKWI_CLI_TOKEN" ]; then echo "WOKWI_SKIPPED: secret WOKWI_CLI_TOKEN is not set" >> "$RUNNER_TEMP/wokwi-cli.log"; fi
          cat "$RUNNER_TEMP/wokwi.log" >> "$RUNNER_TEMP/wokwi-cli.log" 2>/dev/null || true
          python3 .github/scripts/report.py log wokwi "$RUNNER_TEMP/wokwi-cli.log" "$RUNNER_TEMP/wokwi-cli.log"
