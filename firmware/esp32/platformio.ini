[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx@1.19.0
  bblanchon/ArduinoJson@7.4.2
build_flags = -I config

; Wokwi CI self-test: scripted commands, no network, tracked config.selftest.h.
; Never flash this image to a real controller.
[env:wokwi_selftest]
extends = env:esp32dev
build_flags = -I config -DFARM_WOKWI_SELFTEST=1
